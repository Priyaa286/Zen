<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#paint0_radial)" fill-opacity="0.6"/>

  <!-- Subtle grid pattern -->
  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 315) rotate(90) scale(400 700)">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#465BE5"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="paypal_grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#003087"/>
      <stop offset="100%" stop-color="#0079C1"/>
    </linearGradient>
  </defs>

  <!-- Card Border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" stroke="#334155" stroke-width="2" fill="none"/>

  <!-- Top Badges -->
  <g transform="translate(80, 90)">
    <rect width="180" height="36" rx="18" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#10B981"/>
    <text x="36" y="23" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">BORDERLESS AGENT</text>
  </g>

  <g transform="translate(280, 90)">
    <rect width="190" height="36" rx="18" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="20" y="23" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">6 GLOBAL HUBS · DDP</text>
  </g>

  <!-- Zen Brand & Logo Mark -->
  <g transform="translate(80, 165)">
    <!-- Symbol -->
    <rect width="64" height="64" rx="16" fill="url(#brand_grad)"/>
    <path d="M22 22 H42 L22 42 H42" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Logo Text -->
    <text x="85" y="48" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Zen Global</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="295" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="750" letter-spacing="-1.5">
    AI-Powered Borderless Shopping
  </text>
  <text x="80" y="355" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
    Shop authentic international products with upfront landed costs &amp; PayPal protection.
  </text>

  <!-- Value Pill Badges Bottom -->
  <g transform="translate(80, 425)">
    <!-- Pill 1: Currency Conversion -->
    <g transform="translate(0, 0)">
      <rect width="280" height="64" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="24" y="28" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">CURRENCY RECONCILIATION</text>
      <text x="24" y="48" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Live FX in 12+ Local Currencies</text>
    </g>

    <!-- Pill 2: Guaranteed Landed Cost -->
    <g transform="translate(305, 0)">
      <rect width="280" height="64" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="24" y="28" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">LANDED COST GUARANTEE</text>
      <text x="24" y="48" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Air Freight + Duties Pre-Calculated</text>
    </g>

    <!-- Pill 3: PayPal Buyer Protection -->
    <g transform="translate(610, 0)">
      <rect width="320" height="64" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="24" y="28" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">PAYPAL BUYER PROTECTION</text>
      <text x="24" y="48" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Explicit Consent Before Payment Capture</text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="80" y="540" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">
    zen.global · Cross-Border Shopping Assistant
  </text>
</svg>

