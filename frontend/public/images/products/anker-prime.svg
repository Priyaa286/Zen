<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <radialGradient id="studioWall" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#F6F4ED"/>
      <stop offset="68%" stop-color="#EEEAE0"/>
      <stop offset="100%" stop-color="#E5E0D4"/>
    </radialGradient>
    <radialGradient id="contactShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151923" stop-opacity="0.26"/>
      <stop offset="52%" stop-color="#151923" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#151923" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chassisBody" x1="255" y1="108" x2="545" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#373C49"/>
      <stop offset="48%" stop-color="#21252F"/>
      <stop offset="100%" stop-color="#151923"/>
    </linearGradient>
    <linearGradient id="metalCap" x1="255" y1="108" x2="545" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9BDC7"/>
      <stop offset="48%" stop-color="#E8EAEE"/>
      <stop offset="100%" stop-color="#9CA2AF"/>
    </linearGradient>
    <linearGradient id="oledGlass" x1="286" y1="142" x2="514" y2="274" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111520"/>
      <stop offset="100%" stop-color="#07090F"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#studioWall)"/>
  <rect x="0" y="428" width="800" height="172" fill="#E8E3D7" opacity="0.55"/>
  <ellipse cx="400" cy="466" rx="186" ry="22" fill="url(#contactShadow)"/>

  <!-- Side rotary power dial -->
  <rect x="536" y="210" width="16" height="70" rx="5" fill="#7D8391"/>
  <rect x="541" y="218" width="5" height="54" rx="2" fill="#A9AFBC"/>

  <!-- Anodized chassis -->
  <rect x="256" y="108" width="284" height="350" rx="26" fill="url(#chassisBody)"/>
  <!-- Brushed titanium top bevel -->
  <rect x="256" y="108" width="284" height="14" rx="7" fill="url(#metalCap)" opacity="0.82"/>

  <!-- Glass Smart Display -->
  <rect x="284" y="142" width="228" height="122" rx="12" fill="url(#oledGlass)" stroke="#2F3545" stroke-width="1.5"/>
  <!-- Minimalist architectural readout bars (subtle amber-white & indigo telemetry) -->
  <rect x="312" y="170" width="96" height="10" rx="2" fill="#E6E7EC" opacity="0.88"/>
  <rect x="312" y="190" width="52" height="5" rx="1.5" fill="#747987" opacity="0.7"/>
  <rect x="312" y="216" width="172" height="3" rx="1.5" fill="#232836"/>
  <rect x="312" y="216" width="124" height="3" rx="1.5" fill="#465BE6"/>
  <rect x="312" y="232" width="172" height="3" rx="1.5" fill="#232836"/>
  <rect x="312" y="232" width="88" height="3" rx="1.5" fill="#168B66"/>
  <!-- Diagonal glass glare -->
  <path d="M294 146H412L356 260H294C289 260 286 256 286 251V154C286 149 289 146 294 146Z" fill="#FFFFFF" opacity="0.035"/>

  <!-- Four USB-C PD ports -->
  <rect x="292" y="298" width="44" height="16" rx="8" fill="#0B0E16" stroke="#596070" stroke-width="1.5"/>
  <rect x="303" y="304.5" width="22" height="3" rx="1.5" fill="#2A303E"/>

  <rect x="349" y="298" width="44" height="16" rx="8" fill="#0B0E16" stroke="#596070" stroke-width="1.5"/>
  <rect x="360" y="304.5" width="22" height="3" rx="1.5" fill="#2A303E"/>

  <rect x="406" y="298" width="44" height="16" rx="8" fill="#0B0E16" stroke="#596070" stroke-width="1.5"/>
  <rect x="417" y="304.5" width="22" height="3" rx="1.5" fill="#2A303E"/>

  <rect x="463" y="298" width="44" height="16" rx="8" fill="#0B0E16" stroke="#596070" stroke-width="1.5"/>
  <rect x="474" y="304.5" width="22" height="3" rx="1.5" fill="#2A303E"/>

  <!-- Two USB-A ports -->
  <rect x="320" y="334" width="70" height="18" rx="3" fill="#0B0E16" stroke="#596070" stroke-width="1.5"/>
  <rect x="326" y="339" width="58" height="4" rx="1" fill="#465BE6" opacity="0.75"/>

  <rect x="406" y="334" width="70" height="18" rx="3" fill="#0B0E16" stroke="#596070" stroke-width="1.5"/>
  <rect x="412" y="339" width="58" height="4" rx="1" fill="#465BE6" opacity="0.75"/>

  <!-- Etched base accent line -->
  <rect x="366" y="426" width="64" height="2.5" rx="1.25" fill="#747987" opacity="0.45"/>
</svg>
